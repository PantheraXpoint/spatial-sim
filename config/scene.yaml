# =============================================================================
# Scene composition. Environments are REFERENCED into a parent USD with a
# transform offset so they sit side by side.
#
# Asset paths are from the plan and MUST be confirmed against the actual asset
# library before use.
# =============================================================================

environments:
  - name: warehouse
    # Strongly consider starting from the pre-labelled sample stage instead:
    #   Samples/Replicator/Stage/full_warehouse_worker_and_anim_cameras.usd
    # It ships with a warehouse, a worker character, multiple cameras, and
    # SEMANTIC LABELS ALREADY APPLIED -- roughly 60% of the scene. Missing
    # semantic labels is the usual reason segmentation annotators return empty.
    asset: Isaac/Environments/Simple_Warehouse/full_warehouse.usd
    # Lighter variant for fast iteration:
    #   Isaac/Environments/Simple_Warehouse/small_warehouse_digital_twin.usd
    offset: [0.0, 0.0, 0.0]

  - name: second_building
    asset: null          # hospital or office -- decide at M8
    offset: [60.0, 0.0, 0.0]

avatar:
  # CONFIRMED against the stage, not guessed: the saved stage's default prim is
  # /Root and its children are forklift, GroundPlane, Lights, Warehouse,
  # Cameras, Worker. There is no /World. (GUI 2026-08-15; re-readable with
  # sim/verify_avatar.py.)
  prim_path: /Root/Avatar
  # ALL FOUR of these are load-bearing. Miss any one and sensors silently do
  # not react to you, with no error message anywhere.
  #
  # `kinematic` is now delivered by PhysX's CHARACTER CONTROLLER rather than by
  # UsdPhysics.RigidBodyAPI(kinematicEnabled=true), and that is not a rename.
  # A kinematic rigid body is moved to its target pose unconditionally and is
  # never depenetrated, so it walks straight through shelving -- it cannot pass
  # the S6 visual gate. A CCT is built on a kinematic actor (no ragdoll, no
  # falling through floors: the property this flag was asking for) AND does
  # collide-and-slide against static geometry. See sim/avatar.py.
  kinematic: true            # dynamic bodies ragdoll and fall through floors
  # The CCT *is* the collision representation, so the capsule carries no
  # UsdPhysics.CollisionAPI: CollisionAPI without a rigid body means STATIC
  # geometry, which would sit inside the controller and fight it. Separately,
  # what ray sensors bounce off is RENDER geometry, not colliders -- so the
  # body must stay visible with default purpose, which is the check that
  # actually protects the sensors.
  collision_mesh: true       # ray-based sensors need geometry to bounce off
  semantic_class: person     # or segmentation/bbox annotators return nothing
  height: 1.75
  radius: 0.30               # capsule radius; cylinder = height - 2*radius
  eye_height: 1.65
  # The character-controller OmniGraph node types speed as an int in units/s
  # and this stage is 1.0 m/unit, so this rounds to 1 m/s at runtime.
  move_speed: 1.4            # m/s, roughly human walking pace

robots:
  - id: BOT_01
    asset: Robots/Turtlebot/Turtlebot3/turtlebot3_burger.usd
    position: [4.0, 2.0, 0.0]
    sensor_height: 0.2
    static: true
  - id: BOT_02
    asset: Robots/Unitree/Go2/go2.usd
    position: [6.0, -1.0, 0.0]
    sensor_height: 0.4
    static: true
  - id: BOT_03
    asset: null              # Robotics Examples -> POLICY -> Humanoid (H1)
    position: [8.0, 1.5, 0.0]
    sensor_height: 1.7
    static: true

# `station_type: multimodal` is a CLAIM, and core/registry.py enforces it:
# the station must carry all three of camera, lidar, and radar. Three modalities
# at one pose observing one event isolates modality as the only variable; two of
# three is a confound, not a control.
#
# Omit station_type for a station that is deliberately not complete -- a
# camera+lidar ablation, or a platform carrying whatever an experiment needs.
# Nothing is inferred from which sensors happen to be present, so adding a lidar
# somewhere never creates a silent obligation to add a radar next to it.
stations:
  # WALL, not ceiling, and the height is a measured constraint rather than a
  # preference. A rotary lidar's vertical FOV is a narrow band: Example_Rotary
  # sweeps elevations -15..+10 deg (Example_Rotary_BEAMS.json, in
  # omni.sensors.nv.common). A mount at height h therefore only sees an avatar
  # whose centre is at z=0.9 when the horizontal distance d satisfies
  #     d >= (h - 0.9) / tan(15 deg)
  # A ceiling mount fails this badly: measured at 8.70 m directly overhead the
  # lidar returned 418,235 points and NOT ONE on the avatar, silently. At 6.50 m
  # -- the position this entry used to hold -- the avatar would have to stand
  # 20.9 m away.
  #
  # Pose derived from the stage, not chosen: /Root/Warehouse/SM_WallA_6M15 is a
  # real wall (z span 0.00..3.10, centre 5.36, 6.60), and this sits 0.35 m off
  # its face at 2.60 m, which is 6.66 m from where the avatar spawns. Required
  # distance at 2.60 m is 6.34 m, so the torso and head are in band with margin;
  # the feet clip below about 15 deg, which is what a real wall-mounted lidar
  # does too.
  #
  # station_type stays `multimodal`: camera, lidar and radar share this one
  # pose, which is the claim -- three modalities, one viewpoint, one event.
  - id: INFRA_01
    prim_path: /Root/Infrastructure/INFRA_01
    # TWO POSES, on purpose, because two consumers need different things and
    # one field cannot serve both:
    #
    #   position       the MOCK's world (core/mock_source.py, Layer 3). A
    #                  synthetic space with a circular avatar circuit and no
    #                  occlusion, against which the memory module's
    #                  signal-to-noise margin is calibrated. Changing it moves
    #                  the probe object relative to the station and retunes
    #                  tests/test_memory.py by accident -- measured: shifting
    #                  this to the stage pose dropped that margin from 10.8x
    #                  to 9.4x and failed the guard.
    #   stage_position the CONFIRMED pose in the Isaac stage, used by
    #                  sim/sensor_factory.py. Physical, and constrained.
    #
    # They are not yet the same number and that divergence is deliberate rather
    # than settled: making the mock mirror the warehouse means recalibrating
    # the Layer 3/4 fixtures, which is a decision of its own and not a
    # side-effect of placing a sensor.
    position: [5.0, 0.0, 6.5]
    stage_position: [4.910, 6.610, 2.60]
    mount: wall
    station_type: multimodal
  # INFRA_02 is NOT built on this stage: `second_building` below still has a
  # null asset, so its prim path does not exist and sim/sensor_factory.py skips
  # it. It stays declared because it is the experimental control the memory
  # module is tested against -- a station 60 m away that must never see the
  # avatar. Give it a real prim_path when the second environment lands.
  - id: INFRA_02
    prim_path: /World/Infrastructure/INFRA_02
    position: [62.0, 3.0, 3.0]
    mount: wall
    station_type: multimodal

renderer:
  # Cap at 2. Corrupted/empty frames are reported with many render products
  # across many GPUs. Validate by rendering the same scene at maxGpuCount=1
  # and =2 and comparing -- a meaningful difference means the bug is present.
  max_gpu_count: 2
  # Radar needs these. They raise VRAM and render cost for EVERY sensor, so
  # keep them false until M9 and toggle off when not demoing radar.
  raytracing_motion: false
