# =============================================================================
# THE SENSOR REGISTRY -- single source of truth.
#
# Viewport creation, annotator attachment, the inspector panel, and all future
# logging read from this file. Adding a sensor = adding an entry here.
#
# prim_path values below are PLACEHOLDERS from the plan. Confirm each one
# against the actual stage tree before running anything. Never invent a prim
# path -- a wrong path does not render badly, it crashes.
# =============================================================================

sensors:

  # --- INFRA-01: warehouse WALL, 2.6 m ---------------------------------------
  # All three modalities co-located under one Xform so they share a pose.
  # Wall rather than ceiling because a rotary lidar's elevation band is only
  # -15..+10 deg: measured from the ceiling it returned 418,235 points and none
  # on the avatar. The full derivation lives with the station in scene.yaml.
  # CONFIRMED: /Root/Infrastructure/INFRA_01 is authored by sim/sensor_factory.py
  # from that station entry, so these paths exist at runtime.
  - id: INFRA_01_CAM
    modality: rgbd
    mount: fixed
    parent: /Root/Infrastructure/INFRA_01
    prim_path: /Root/Infrastructure/INFRA_01/cam_01
    resolution: [1280, 720]
    annotators: [rgb, distance_to_camera, semantic_segmentation]
    notes: "Wall viewpoint at 2.6 m, looking down the aisle at the avatar."

  - id: INFRA_01_LIDAR
    modality: lidar
    mount: fixed
    parent: /Root/Infrastructure/INFRA_01
    prim_path: /Root/Infrastructure/INFRA_01/lidar_01
    config: Example_Rotary
    annotators: [generic-model-output]
    notes: "M5 money shot. Expect points ON the avatar plus an occlusion
            shadow behind it -- the 'void' is the shadow, not the avatar."

  - id: INFRA_01_RADAR
    modality: radar
    mount: fixed
    parent: /Root/Infrastructure/INFRA_01
    prim_path: /Root/Infrastructure/INFRA_01/radar_01
    config: Example_Radar
    annotators: [generic-model-output]
    notes: "Requires Motion BVH -- raises render cost for ALL sensors.
            Add last, toggle off when not demoing."

  # --- INFRA-02: factory wall, ~3 m ------------------------------------------
  # NOT INSTANTIATED IN ISAAC, and deliberately still here. `second_building`
  # has no asset, so /World/Infrastructure/INFRA_02 is not on the stage and
  # sim/sensor_factory.py skips these three automatically -- the same way it
  # skips BOT_*. Nothing invents a path and no GUI time is spent on them.
  #
  # They stay because INFRA_02 is the EXPERIMENTAL CONTROL for Layers 3-4: a
  # station 60 m away that must never see the avatar. core/mock_source.py,
  # tests/test_memory.py and tests/contract.py are all built on it -- a change
  # detector that fires here is firing on its own noise. Deleting these
  # entries fails 7 tests and removes the guard, which is a steeper price than
  # the stage-side clutter of three specs that resolve to nothing.
  - id: INFRA_02_CAM
    modality: rgbd
    mount: fixed
    parent: /World/Infrastructure/INFRA_02
    prim_path: /World/Infrastructure/INFRA_02/cam_02
    resolution: [1280, 720]
    annotators: [rgb, distance_to_camera, semantic_segmentation]

  - id: INFRA_02_LIDAR
    modality: lidar
    mount: fixed
    parent: /World/Infrastructure/INFRA_02
    prim_path: /World/Infrastructure/INFRA_02/lidar_02
    config: Example_Rotary
    annotators: [generic-model-output]

  - id: INFRA_02_RADAR
    modality: radar
    mount: fixed
    parent: /World/Infrastructure/INFRA_02
    prim_path: /World/Infrastructure/INFRA_02/radar_02
    config: Example_Radar
    annotators: [generic-model-output]

  # --- Robot observation platforms (all static) ------------------------------
  # RGB-D only. Modality contrast lives in the infrastructure stations; the
  # robots contrast HEIGHT and VIEWPOINT. Ceiling sees your top, the Go2 sees
  # your legs, the humanoid sees your face.
  # ALL THREE CONFIRMED: sim/spikes/_place_robots.py authors these prims from
  # config/scene.yaml stage_position, all three stayed upright across 120
  # frames of Play, and every camera was measured capturing the avatar --
  # 16,036 / 15,267 / 12,895 'person' px at 0.2 / 0.4 / 1.7 m.
  - id: BOT_01_CAM
    modality: rgbd
    mount: robot
    parent: /Root/Robots/BOT_01
    prim_path: /Root/Robots/BOT_01/cam
    resolution: [640, 480]
    annotators: [rgb, distance_to_camera]
    notes: "TurtleBot3 Burger, ~0.2 m. Ground level."

  - id: BOT_02_CAM
    modality: rgbd
    mount: robot
    parent: /Root/Robots/BOT_02
    prim_path: /Root/Robots/BOT_02/cam
    resolution: [640, 480]
    annotators: [rgb, distance_to_camera]
    notes: "Unitree Go2, ~0.4 m. Static -- legged robots collapse on spawn
            without a locomotion policy."

  - id: BOT_03_CAM
    modality: rgbd
    mount: robot
    parent: /Root/Robots/BOT_03
    prim_path: /Root/Robots/BOT_03/cam
    resolution: [640, 480]
    annotators: [rgb, distance_to_camera]
    notes: "Unitree H1 humanoid, ~1.7 m. Eye level."

  # --- Avatar cameras --------------------------------------------------------
  # The ONLY moving mount in the scene, and therefore the only possible source
  # of embodied experience rather than allocentric state.
  # CONFIRMED against the built stage (S6), not placeholders like the entries
  # above: the stage root is /Root, and both cameras hang off the capsule
  # rather than off the Avatar Xform because PhysX moves the capsule -- cameras
  # parented to the Xform would stay put while the body walked away. They are
  # still descendants of /Root/Avatar. See sim/avatar.py.
  - id: AVATAR_CAM_FP
    modality: rgb
    mount: avatar
    parent: /Root/Avatar
    prim_path: /Root/Avatar/body_mesh/cam_first_person
    resolution: [1280, 720]
    annotators: [rgb]

  - id: AVATAR_CAM_TP
    modality: rgb
    mount: avatar
    parent: /Root/Avatar
    prim_path: /Root/Avatar/body_mesh/cam_third_person
    resolution: [1280, 720]
    annotators: [rgb]
