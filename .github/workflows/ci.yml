name: ci
on: [push, pull_request]

jobs:
  boundary-and-tests:
    # Runs on a plain CPU runner with no GPU and no simulator. That is the
    # point: if this job ever needs a GPU, the layer boundary has leaked.
    #
    # This builds and uses the SAME dev image as `make verify`. An earlier
    # version installed requirements directly on the runner, which meant CI and
    # local development were two different environments -- the image could rot
    # without CI ever noticing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: make dev-build
      - name: Layer boundary
        run: make check
      - name: Tests
        run: make test
      - name: Lint
        run: make lint